<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste NICE CXone</title>
</head>

<body>

    <h1>Teste NICE CXone</h1>

    <p>Teste do Web Chat</p>

    <button onclick="abrirChat()">
        Abrir Web Chat
    </button>

    <script>

        // ==========================================
        // CARREGAMENTO DO CXone
        // ==========================================

        (function(n,u){

            window.CXoneDfo = n;

            window[n] = window[n] || function(){

                (window[n].q = window[n].q || []).push(arguments);

            };

            window[n].u = u;

            var e = document.createElement("script");

            e.type = "module";

            e.src = u + "?" + Math.round(Date.now() / 1e3 / 3600);

            document.head.appendChild(e);

        })(
            'cxone',
            'https://web-modules-de-na1.niceincontact.com/loader/1/loader.js'
        );


        // ==========================================
        // INICIALIZA CXone
        // ==========================================

        cxone('init', '2082');


        // ==========================================
        // INICIALIZA O CHAT
        // ==========================================

        cxone(
            'chat',
            'init',
            2082,
            'chat_2dfda40d-735f-4d78-9139-1b582825f234'
        );


        // ==========================================
        // ABRIR CHAT
        // ==========================================

        function abrirChat() {

            console.log("Abrindo CXone Chat...");

            cxone(
                'chat',
                'openChatWindow'
            );

        }

    </script>

</body>

</html>
