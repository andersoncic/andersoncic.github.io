<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste CXone DEV</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }
    </style>
</head>

<body>

<script>
(function(n,u){

    window.CXoneDfo = n;

    window[n] = window[n] || function() {
        (window[n].q = window[n].q || []).push(arguments);
    };

    window[n].u = u;

    var e = document.createElement("script");

    e.type = "module";
    e.src = u + "?" + Math.round(Date.now() / 1e3 / 3600);

    document.head.appendChild(e);

})(
    'cxone',
    'https://web-modules-de-na1.niceincontact.com/loader/1/loader.js'
);


/* ============================================================
   CXONE - INICIALIZAÇÃO
   ============================================================ */

cxone(
    'init',
    '5731'
);

cxone(
    'chat',
    'init',
    5731,
    'chat_8a486555-27cf-4666-adf5-3de6195582dd'
);


/* ============================================================
   IDIOMA
   ============================================================ */

cxone(
    'chat',
    'setLocale',
    'pt-BR'
);


/* ============================================================
   TRADUÇÕES
   ============================================================ */

cxone(
    'chat',
    'setTranslations',
    {
        replyBoxPlaceholder: 'Digite sua mensagem...',
        sendMessageButton: 'Enviar mensagem',

        retry: 'Tentar novamente',
        cancel: 'Cancelar',
        done: 'Concluído',

        startNewChat: 'Iniciar novo atendimento',

        waitingForAgent: 'Aguardando atendente...',
        waitingInQueue: 'Aguardando atendimento...',

        statusReconnecting: 'Tentando reconectar...',

        unexpectedError: 'Ocorreu um erro inesperado.',

        validationMandatory: 'Este campo é obrigatório.',

        pleaseSelect: 'Selecione...',

        poweredBy: 'Desenvolvido por'
    }
);


/* ============================================================
   PRIMEIRA MENSAGEM AUTOMÁTICA
   ============================================================ */

cxone(
    'chat',
    'hidePreSurvey'
);


/*
 * TESTE:
 *
 * O CXone deverá enviar automaticamente esta mensagem
 * quando a sessão de chat for iniciada.
 */

cxone(
    'chat',
    'sendFirstMessageAutomatically',
    'TESTE CXONE - mensagem automática'
);


/*
 * Deixa a primeira mensagem automática visível
 * para o cliente.
 */

cxone(
    'chat',
    'hideFirstSentMessage',
    false
);


/* ============================================================
   CSS PERSONALIZADO
   ============================================================ */

cxone(
    'chat',
    'setCustomCss',
    `
    [data-selector="CONTENT"] {
        background: #ffffff !important;
    }

    [data-selector="HEADER"] {
        background: #0077b5 !important;
        color: #ffffff !important;
    }

    [data-selector="CUSTOMER_MESSAGE_BUBBLE"] {
        background: #0077b5 !important;
        color: #ffffff !important;
        border-radius: 12px !important;
    }

    [data-selector="AGENT_MESSAGE_BUBBLE"] {
        background: #f1f1f1 !important;
        color: #222222 !important;
        border-radius: 12px !important;
    }

    [data-selector="REPLY_BOX"] {
        border-radius: 12px !important;
    }

    [data-selector="TEXTAREA"] {
        border-radius: 10px !important;
    }

    [data-selector="SEND_BUTTON"] {
        border-radius: 50% !important;
    }
    `
);


/* ============================================================
   INDICADOR DE QUE O CXONE FOI CARREGADO
   ============================================================ */

window.CXONE_DEV_READY = true;


/* ============================================================
   FUNÇÃO PARA ABRIR O CHAT
   ============================================================ */

window.iniciarChatCXone = function() {

    console.log('CXone: iniciando atendimento...');

    cxone(
        'chat',
        'openChatWindow'
    );

};


/* ============================================================
   FUNÇÃO DE TESTE MANUAL
   ============================================================ */

window.testarMensagemCXone = function() {

    console.log('CXone: testando mensagem automática...');

    cxone(
        'chat',
        'sendFirstMessageAutomatically',
        'TESTE CXONE - mensagem automática'
    );

    cxone(
        'chat',
        'hideFirstSentMessage',
        false
    );

};


/* ============================================================
   FIM
   ============================================================ */

console.log('CXone DEV carregado.');

</script>

</body>
</html>
