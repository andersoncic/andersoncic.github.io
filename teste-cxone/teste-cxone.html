<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teste DEV - CXone</title>

    <style>

        body {
            margin: 0;
            padding: 40px;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            text-align: center;
        }

        h1 {
            color: #0077b5;
        }

        button {
            padding: 15px 30px;

            border: none;
            border-radius: 8px;

            background: #0077b5;

            color: #ffffff;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #005f91;
        }

    </style>

</head>


<body>

    <h1>Teste DEV - CXone</h1>

    <p>
        Teste de início automático do atendimento.
    </p>

    <button onclick="iniciarAtendimento()">
        Iniciar atendimento
    </button>


<script>

/*
==========================================================
CXONE - LOADER
==========================================================
*/

(function(n,u){

    window.CXoneDfo = n;

    window[n] = window[n] || function(){

        (window[n].q = window[n].q || []).push(arguments);

    };

    window[n].u = u;

    var e = document.createElement("script");

    e.type = "module";

    e.src = u + "?" +
        Math.round(
            Date.now() / 1e3 / 3600
        );

    document.head.appendChild(e);

})(
    'cxone',
    'https://web-modules-de-na1.niceincontact.com/loader/1/loader.js'
);


/*
==========================================================
CXONE - INIT
==========================================================
*/

cxone(
    'init',
    '5731'
);


/*
==========================================================
CXONE CHAT - INIT
==========================================================
*/

cxone(
    'chat',
    'init',
    5731,
    'chat_8a486555-27cf-4666-adf5-3de6195582dd'
);


/*
==========================================================
IDIOMA
==========================================================
*/

cxone(
    'chat',
    'setLocale',
    'pt-BR'
);


/*
==========================================================
TRADUÇÕES
==========================================================
*/

cxone(
    'chat',
    'setTranslations',
    {

        replyBoxPlaceholder:
            'Digite sua mensagem...',

        sendMessageButton:
            'Enviar mensagem',

        retry:
            'Tentar novamente',

        cancel:
            'Cancelar',

        done:
            'Concluído',

        startNewChat:
            'Iniciar novo atendimento',

        waitingForAgent:
            'Aguardando atendente...',

        waitingInQueue:
            'Aguardando atendimento...',

        statusReconnecting:
            'Tentando reconectar...',

        unexpectedError:
            'Ocorreu um erro inesperado.',

        validationMandatory:
            'Este campo é obrigatório.',

        pleaseSelect:
            'Selecione...',

        poweredBy:
            'Desenvolvido por'

    }
);


/*
==========================================================
MENSAGEM AUTOMÁTICA
==========================================================

Essa mensagem deverá aparecer para o CLIENTE.

==========================================================
*/

cxone(
    'chat',
    'setFirstAutomatedMessageContent',
    'TESTE CXONE - mensagem automática para o cliente'
);


/*
==========================================================
MOSTRAR A MENSAGEM AUTOMÁTICA
==========================================================

false = mensagem NÃO ficará escondida.

==========================================================
*/

cxone(
    'chat',
    'hideFirstSentMessage',
    false
);


/*
==========================================================
CSS DO CHAT
==========================================================
*/

cxone(
    'chat',
    'setCustomCss',
    `

    [data-selector="CONTENT"] {
        background: #ffffff !important;
    }

    [data-selector="HEADER"] {
        background: #0077b5 !important;
        color: #ffffff !important;
    }

    [data-selector="CUSTOMER_MESSAGE_BUBBLE"] {
        background: #0077b5 !important;
        color: #ffffff !important;
        border-radius: 12px !important;
    }

    [data-selector="AGENT_MESSAGE_BUBBLE"] {
        background: #f1f1f1 !important;
        color: #222222 !important;
        border-radius: 12px !important;
    }

    [data-selector="REPLY_BOX"] {
        border-radius: 12px !important;
    }

    [data-selector="TEXTAREA"] {
        border-radius: 10px !important;
    }

    [data-selector="SEND_BUTTON"] {
        border-radius: 50% !important;
    }

    `
);


/*
==========================================================
INICIAR ATENDIMENTO
==========================================================
*/

function iniciarAtendimento() {

    console.log(
        'Abrindo janela CXone...'
    );


    /*
    ------------------------------------------------------
    ABRE O CHAT
    ------------------------------------------------------
    */

    cxone(
        'chat',
        'openChatWindow'
    );


    /*
    ------------------------------------------------------
    INICIA O CHAT AUTOMATICAMENTE
    ------------------------------------------------------

    IMPORTANTE:

    autoStartSession deve ser a última
    chamada CXone deste fluxo.

    ------------------------------------------------------
    */

    console.log(
        'Iniciando sessão automaticamente...'
    );

    cxone(
        'chat',
        'autoStartSession'
    );

}

</script>

</body>

</html>
