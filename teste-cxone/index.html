<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste NICE CXone</title>
</head>

<body>

    <h1>Teste NICE CXone</h1>

    <p>Web Chat da NICE</p>

    <button onclick="abrirChat()">
        Abrir Chat
    </button>


    <script>

        // ==========================================
        // CARREGA O CXone
        // ==========================================

        (function(n,u){

            window.CXoneDfo = n;

            window[n] = window[n] || function(){

                (window[n].q = window[n].q || []).push(arguments);

            };

            window[n].u = u;

            var e = document.createElement("script");

            e.type = "module";

            e.src = u + "?" + Math.round(Date.now() / 1e3 / 3600);

            document.head.appendChild(e);

        })(
            'cxone',
            'https://web-modules-de-na1.niceincontact.com/loader/1/loader.js'
        );


        // ==========================================
        // BRAND
        // ==========================================

        cxone('init', '5731');


        // ==========================================
        // INICIALIZA O WEB CHAT
        // ==========================================

        cxone(
            'chat',
            'init',
            5731,
            'chat_8a486555-27cf-4666-adf5-3de6195582dd'
        );


        // ==========================================
        // FUNÇÃO PARA ABRIR O CHAT
        // ==========================================

        function abrirChat() {

            console.log("Abrindo Web Chat CXone...");

            cxone(
                'chat',
                'openChatWindow'
            );

        }

    </script>

</body>

</html>
