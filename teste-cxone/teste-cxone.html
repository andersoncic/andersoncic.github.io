<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teste DEV - CXone</title>

    <style>

        body {
            margin: 0;
            padding: 40px;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            text-align: center;
        }

        h1 {
            color: #0077b5;
        }

        button {
            padding: 15px 30px;

            border: none;
            border-radius: 8px;

            background: #0077b5;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

    </style>

</head>


<body>

    <h1>Teste DEV - CXone</h1>

    <p>
        Teste de mensagem automática.
    </p>

    <button onclick="iniciarAtendimento()">
        Iniciar atendimento
    </button>


<script>


/*
==========================================================
CXONE LOADER
==========================================================
*/

(function(n,u){

    window.CXoneDfo = n;

    window[n] = window[n] || function(){

        (window[n].q = window[n].q || []).push(arguments);

    };

    window[n].u = u;

    var e = document.createElement("script");

    e.type = "module";

    e.src = u + "?" +
        Math.round(
            Date.now() / 1e3 / 3600
        );

    document.head.appendChild(e);

})(
    'cxone',
    'https://web-modules-de-na1.niceincontact.com/loader/1/loader.js'
);


/*
==========================================================
CXONE INIT
==========================================================
*/

cxone(
    'init',
    '5731'
);


/*
==========================================================
CHAT INIT
==========================================================

IMPORTANTE:

storageType = local


==========================================================
*/

cxone(
    'chat',
    'init',
    5731,
    'chat_8a486555-27cf-4666-adf5-3de6195582dd',
    undefined,
    {
        storageType: 'local'
    }
);


/*
==========================================================
IDIOMA
==========================================================
*/

cxone(
    'chat',
    'setLocale',
    'pt-BR'
);


/*
==========================================================
NOME
==========================================================
*/

cxone(
    'chat',
    'setCustomerName',
    'Teste'
);


/*
==========================================================
MENSAGEM AUTOMÁTICA
==========================================================
*/

cxone(
    'chat',
    'sendFirstMessageAutomatically',
    'TESTE CXONE - mensagem automática para o cliente'
);


/*
==========================================================
ESCONDER PRIMEIRA MENSAGEM
==========================================================
*/

cxone(
    'chat',
    'hideFirstSentMessage',
    true
);


/*
==========================================================
MONITORAR TODOS OS EVENTOS
==========================================================
*/

cxone(
    'chat',
    'onAnyPushUpdate',
    function(evento) {

        console.log(
            '======================================'
        );

        console.log(
            'CXONE EVENT'
        );

        console.log(
            evento
        );

        console.log(
            '======================================'
        );

    }
);


/*
==========================================================
MONITORAR ENCERRAMENTO DO CASO
==========================================================
==========================================================
*/

cxone(
    'chat',
    'onPushUpdate',
    ['CaseStatusChanged'],
    function(pushUpdatePayload) {

        console.log(
            '======================================'
        );

        console.log(
            'CASE STATUS CHANGED'
        );

        console.log(
            pushUpdatePayload
        );

        console.log(
            '======================================'
        );


        /*
        --------------------------------------------------
        VALIDAR PAYLOAD
        --------------------------------------------------
        */

        if (
            typeof pushUpdatePayload === 'undefined'
        ) {

            console.log(
                'Payload não recebido.'
            );

            return;

        }


        if (
            typeof pushUpdatePayload.data === 'undefined'
        ) {

            console.log(
                'Payload.data não existe.'
            );

            return;

        }


        /*
        --------------------------------------------------
        PEGAR CASE
        --------------------------------------------------
        */

        const caseData =
            pushUpdatePayload.data.case || {};


        console.log(
            'CASE:',
            caseData
        );


        /*
        --------------------------------------------------
        PEGAR STATUS
        --------------------------------------------------
        */

        const status =
            caseData.status;


        console.log(
            'STATUS:',
            status
        );


        /*
        --------------------------------------------------
        CASO ENCERRADO
        --------------------------------------------------
        */

        if (
            status === 'closed'
        ) {

            console.log(
                '======================================'
            );

            console.log(
                'ATENDIMENTO ENCERRADO'
            );

            console.log(
                'LIMPANDO CUSTOMER ID'
            );

            console.log(
                '======================================'
            );


            /*
            ------------------------------------------------
            REMOVER IDENTIDADE CXONE
            ------------------------------------------------
            */

            localStorage.removeItem(
                '_BECustomerID'
            );


            console.log(
                '_BECustomerID removido.'
            );


            /*
            ------------------------------------------------
            CONFERIR
            ------------------------------------------------
            */

            console.log(
                'Valor atual:',
                localStorage.getItem(
                    '_BECustomerID'
                )
            );

        }

    }
);


/*
==========================================================
INICIAR ATENDIMENTO
==========================================================
*/

function iniciarAtendimento() {

    console.log(
        '======================================'
    );

    console.log(
        'INICIANDO ATENDIMENTO'
    );

    console.log(
        '======================================'
    );


    /*
    ------------------------------------------------------
    ABRIR CHAT
    ------------------------------------------------------
    */

    console.log(
        'Abrindo janela...'
    );

    cxone(
        'chat',
        'openChatWindow'
    );


    /*
    ------------------------------------------------------
    AGUARDAR CHAT
    ------------------------------------------------------
    */

    setTimeout(
        function() {

            console.log(
                'Executando autoStartSession...'
            );


            /*
            --------------------------------------------------
            INICIAR SESSÃO
            --------------------------------------------------
            */

            cxone(
                'chat',
                'autoStartSession'
            );


            console.log(
                'Sessão iniciada.'
            );


        },
        1500
    );

}


</script>

</body>

</html>
