<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste NICE CXone</title>
</head>

<body>

    <h1>Teste NICE CXone</h1>

    <p>Digite o CPF:</p>

    <input
        type="text"
        id="cpf"
        placeholder="Digite o CPF"
        maxlength="11"
    >

    <button onclick="iniciarChat()">
        Iniciar Chat
    </button>

    <p id="status"></p>


    <script>

        // =====================================================
        // CARREGA CXone
        // =====================================================

        (function(n,u){

            window.CXoneDfo = n;

            window[n] = window[n] || function(){

                (window[n].q = window[n].q || []).push(arguments);

            };

            window[n].u = u;

            var e = document.createElement("script");

            e.type = "module";

            e.src = u + "?" + Math.round(Date.now() / 1e3 / 3600);

            document.head.appendChild(e);

        })(
            'cxone',
            'https://web-modules-de-na1.niceincontact.com/loader/1/loader.js'
        );


        // =====================================================
        // INICIALIZA CXone
        // =====================================================

        cxone('init', '5731');


        // =====================================================
        // INICIAR ATENDIMENTO
        // =====================================================

        function iniciarChat() {

            var cpf = document.getElementById('cpf').value;

            var status = document.getElementById('status');


            // Remove pontos, traços e espaços
            cpf = cpf.replace(/[^0-9]/g, '');


            // Validação
            if (cpf.length !== 11) {

                status.innerHTML =
                    'Digite um CPF com 11 números.';

                return;

            }


            console.log('CPF informado:', cpf);


            // =================================================
            // 1 - INICIALIZA O WEB CHAT
            // =================================================

            cxone(
                'chat',
                'init',
                5731,
                'chat_8a486555-27cf-4666-adf5-3de6195582dd'
            );


            console.log('Web Chat inicializado');


            // =================================================
            // 2 - ENVIA O CPF PARA O CUSTOM FIELD
            // =================================================

           // cxone(
           //     'chat',
           //     'setContactCustomField',
           //     'cpf',
            //    cpf
          //  );
cxone(
    'chat',
    'setContactCustomField',
    'cpf',
    '12345678900'
);

cxone(
    'chat',
    'setCustomerCustomField',
    'cpf_customer',
    '12345678900'
);

            console.log(
                'CPF enviado para Custom Field:',
                cpf
            );


            status.innerHTML =
                'CPF enviado. Abrindo atendimento...';


            // =================================================
            // 3 - ABRE O CHAT
            // =================================================

            cxone(
                'chat',
                'openChatWindow'
            );

        }

    </script>

</body>

</html>
