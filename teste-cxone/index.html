<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste NICE CXone</title>
</head>

<body>

    <h1>Teste NICE CXone</h1>

    <p>Digite seu CPF para iniciar o atendimento:</p>

    <input
        type="text"
        id="cpf"
        placeholder="Digite o CPF"
        maxlength="11"
    >

    <button onclick="iniciarChat()">
        Iniciar Chat
    </button>

    <p id="status"></p>


    <script>

        // =====================================================
        // CARREGA O CXone
        // =====================================================

        (function(n,u){

            window.CXoneDfo = n;

            window[n] = window[n] || function(){

                (window[n].q = window[n].q || []).push(arguments);

            };

            window[n].u = u;

            var e = document.createElement("script");

            e.type = "module";

            e.src = u + "?" + Math.round(Date.now() / 1e3 / 3600);

            document.head.appendChild(e);

        })(
            'cxone',
            'https://web-modules-de-na1.niceincontact.com/loader/1/loader.js'
        );


        // =====================================================
        // INICIALIZA CXone
        // =====================================================

        cxone('init', '5731');


        // =====================================================
        // NÃO INICIALIZAMOS O CHAT AQUI
        //
        // O chat será inicializado somente depois
        // que o CPF for enviado.
        // =====================================================


        // =====================================================
        // INICIAR CHAT
        // =====================================================

        function iniciarChat() {

            var cpf = document.getElementById('cpf').value;

            var status = document.getElementById('status');


            // =================================================
            // LIMPA FORMATAÇÃO DO CPF
            // =================================================

            cpf = cpf.replace(/[^0-9]/g, '');


            // =================================================
            // VALIDA CPF
            // =================================================

            if (cpf.length !== 11) {

                status.innerHTML =
                    'Digite um CPF com 11 números.';

                return;
            }


            console.log(
                'CPF informado:',
                cpf
            );


            // =================================================
            // ENVIA CPF PARA O CUSTOM FIELD
            // =================================================

            cxone(
                'chat',
                'setContactCustomField',
                'cpf',
                cpf
            );


            console.log(
                'CPF enviado para o CXone:',
                cpf
            );


            status.innerHTML =
                'CPF enviado. Iniciando Web Chat...';


            // =================================================
            // AGORA INICIALIZA O WEB CHAT
            // =================================================

            cxone(
                'chat',
                'init',
                5731,
                'chat_8a486555-27cf-4666-adf5-3de6195582dd'
            );


            // =================================================
            // ABRE O CHAT
            // =================================================

            cxone(
                'chat',
                'openChatWindow'
            );

        }

    </script>

</body>

</html>
