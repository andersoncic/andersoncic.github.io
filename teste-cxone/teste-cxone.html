<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teste DEV - CXone</title>

    <style>

        body {
            margin: 0;
            padding: 40px;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            text-align: center;
        }

        h1 {
            color: #0077b5;
        }

        button {
            padding: 15px 30px;

            border: none;
            border-radius: 8px;

            background: #0077b5;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

    </style>

</head>


<body>

    <h1>Teste DEV - CXone</h1>

    <p>
        Teste de mensagem automática.
    </p>

    <button onclick="iniciarAtendimento()">
        Iniciar atendimento
    </button>


<script>

/*
==========================================================
CXONE LOADER
==========================================================
*/

(function(n,u){

    window.CXoneDfo = n;

    window[n] = window[n] || function(){

        (window[n].q = window[n].q || []).push(arguments);

    };

    window[n].u = u;

    var e = document.createElement("script");

    e.type = "module";

    e.src = u + "?" +
        Math.round(
            Date.now() / 1e3 / 3600
        );

    document.head.appendChild(e);

})(
    'cxone',
    'https://web-modules-de-na1.niceincontact.com/loader/1/loader.js'
);


/*
==========================================================
INIT
==========================================================
*/

cxone(
    'init',
    '5731'
);


/*
==========================================================
CHAT INIT
==========================================================

storageType: inMemory

O CXone não persiste a sessão no navegador.

==========================================================
*/

cxone(
    'chat',
    'init',
    5731,
    'chat_8a486555-27cf-4666-adf5-3de6195582dd',
    undefined,
    {
        storageType: 'inMemory'
    }
);


/*
==========================================================
IDIOMA
==========================================================
*/

cxone(
    'chat',
    'setLocale',
    'pt-BR'
);


/*
==========================================================
NOME DO CLIENTE
==========================================================
*/

cxone(
    'chat',
    'setCustomerName',
    'Teste'
);


/*
==========================================================
MENSAGEM AUTOMÁTICA
==========================================================
*/

cxone(
    'chat',
    'sendFirstMessageAutomatically',
    'TESTE CXONE - mensagem automática para o cliente'
);


/*
==========================================================
ESCONDER PRIMEIRA MENSAGEM
==========================================================

true = esconde a mensagem automática do cliente, 
essa mensagem esta sendo enviado direto pelo NICE

==========================================================
*/

cxone(
    'chat',
    'hideFirstSentMessage',
    true
);


/*
==========================================================
MONITORAMENTO DOS EVENTOS
==========================================================
*/

cxone(
    'chat',
    'onAnyPushUpdate',
    function(evento) {

        console.log(
            '========== CXONE EVENT =========='
        );

        console.log(evento);

        console.log(
            '================================='
        );

    }
);


/*
==========================================================
LIMPAR HISTÓRICO APÓS ENCERRAMENTO
==========================================================

Quando o caso for encerrado pelo CXone,
removemos o customerID armazenado.

Na próxima sessão o CXone não deverá
recuperar a conversa anterior.

==========================================================
*/

cxone(
    'chat',
    'onPushUpdate',
    [
        'CaseStatusChanged'
    ],
    function(pushUpdatePayload) {

        console.log(
            '========== CASE STATUS =========='
        );

        console.log(
            pushUpdatePayload
        );


        if (
            typeof pushUpdatePayload === 'undefined' ||
            typeof pushUpdatePayload.data === 'undefined'
        ) {

            return;

        }


        const caseData =
            pushUpdatePayload.data.case || {};


        const status =
            caseData.status;


        console.log(
            'Status do atendimento:',
            status
        );


        /*
        --------------------------------------------------
        ATENDIMENTO ENCERRADO
        --------------------------------------------------
        */

        if (
            status === 'closed'
        ) {

            console.log(
                'Atendimento encerrado.'
            );

            console.log(
                'Limpando histórico do CXone...'
            );


            /*
            ------------------------------------------------
            REMOVE CUSTOMER ID
            ------------------------------------------------
            */

            localStorage.removeItem(
                '_BECustomerID'
            );


            console.log(
                'Histórico removido.'
            );

        }

    }
);


/*
==========================================================
INICIAR ATENDIMENTO
==========================================================
*/

function iniciarAtendimento() {

    console.log(
        '================================='
    );

    console.log(
        '1 - BOTÃO CLICADO'
    );

    console.log(
        '================================='
    );


    /*
    ------------------------------------------------------
    ABRIR CHAT
    ------------------------------------------------------
    */

    console.log(
        '2 - Abrindo janela CXone...'
    );

    cxone(
        'chat',
        'openChatWindow'
    );


    /*
    ------------------------------------------------------
    AGUARDAR WIDGET
    ------------------------------------------------------
    */

    setTimeout(
        function() {

            console.log(
                '3 - Executando autoStartSession...'
            );


            /*
            --------------------------------------------------
            INICIAR NOVA SESSÃO
            --------------------------------------------------
            */

            cxone(
                'chat',
                'autoStartSession'
            );


            console.log(
                '4 - autoStartSession enviado.'
            );

        },
        1500
    );

}

</script>

</body>

</html>
