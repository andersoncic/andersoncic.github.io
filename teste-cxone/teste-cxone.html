<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teste DEV - CXone</title>

    <style>

        body {
            margin: 0;
            padding: 40px;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            text-align: center;
        }

        h1 {
            color: #0077b5;
        }

        button {
            padding: 15px 30px;

            border: none;
            border-radius: 8px;

            background: #0077b5;

            color: #ffffff;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #005f91;
        }

    </style>

</head>


<body>

    <h1>Teste DEV - CXone</h1>

    <p>
        Teste de início automático do atendimento.
    </p>

    <button onclick="iniciarAtendimento()">
        Iniciar atendimento
    </button>


<script>

/*
==========================================================
CXONE LOADER
==========================================================
*/

(function(n,u){

    window.CXoneDfo = n;

    window[n] = window[n] || function(){

        (window[n].q = window[n].q || []).push(arguments);

    };

    window[n].u = u;

    var e = document.createElement("script");

    e.type = "module";

    e.src = u + "?" +
        Math.round(
            Date.now() / 1e3 / 3600
        );

    document.head.appendChild(e);

})(
    'cxone',
    'https://web-modules-de-na1.niceincontact.com/loader/1/loader.js'
);


/*
==========================================================
CXONE INIT
==========================================================
*/

cxone(
    'init',
    '5731'
);


/*
==========================================================
CHAT INIT
==========================================================
*/

cxone(
    'chat',
    'init',
    5731,
    'chat_8a486555-27cf-4666-adf5-3de6195582dd'
);


/*
==========================================================
IDIOMA
==========================================================
*/

cxone(
    'chat',
    'setLocale',
    'pt-BR'
);


/*
==========================================================
MENSAGEM AUTOMÁTICA
==========================================================
*/

cxone(
    'chat',
    'setFirstAutomatedMessageContent',
    'TESTE CXONE - mensagem automática para o cliente'
);


/*
==========================================================
MOSTRAR A MENSAGEM AUTOMÁTICA
==========================================================
*/

cxone(
    'chat',
    'hideFirstSentMessage',
    false
);


/*
==========================================================
INICIAR ATENDIMENTO
==========================================================
*/

function iniciarAtendimento() {

    console.log(
        '================================='
    );

    console.log(
        'INICIANDO TESTE CXONE'
    );

    console.log(
        '================================='
    );


    /*
    ------------------------------------------------------
    1. INFORMAR NOME DO CLIENTE
    ------------------------------------------------------

    O seu canal possui "O seu nome" como campo
    obrigatório.

    Por isso vamos preencher o campo via API.

    ------------------------------------------------------
    */

    console.log(
        'Definindo nome do cliente...'
    );

    cxone(
        'chat',
        'setCustomerName',
        'Teste'
    );


    /*
    ------------------------------------------------------
    2. ABRIR JANELA
    ------------------------------------------------------
    */

    console.log(
        'Abrindo janela CXone...'
    );

    cxone(
        'chat',
        'openChatWindow'
    );


    /*
    ------------------------------------------------------
    3. INICIAR SESSÃO AUTOMATICAMENTE
    ------------------------------------------------------

    IMPORTANTE:

    Essa é a última chamada CXone.

    Não existe nenhuma chamada cxone()
    depois dela.

    ------------------------------------------------------
    */

    console.log(
        'Executando autoStartSession...'
    );

    cxone(
        'chat',
        'autoStartSession'
    );


    console.log(
        'autoStartSession executado.'
    );

}

</script>

</body>

</html>
